name: Build release installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1.0"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build MSI
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Upload MSI to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload $env:TAG `
            artifacts/installer/StepAudioDriver-1.9.0.msi `
            artifacts/installer/StepAudioDriver-1.9.0.sha256 `
            --clobber
